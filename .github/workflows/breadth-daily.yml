name: Index breadth daily

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - data/breadth/*_members.csv   # re-run as soon as a new member list is uploaded
  schedule:
    - cron: "40 21 * * 1-5"   # 21:40 UTC weekdays, after both the LSE and US closes
    - cron: "10 6 * * 2-6"    # 06:10 UTC Tue-Sat, before the LSE open: picks up any late Yahoo data

permissions:
  contents: write

concurrency:
  group: breadth-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet yfinance pandas numpy

      # Daily closes are kept between runs as files on the "price-data" release, so
      # each run only tops them up (see scripts/breadth.py). No release yet = full download.
      - name: Fetch stored prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .price-store
          gh release download price-data -D .price-store --clobber || echo "No stored prices yet: this run downloads full history"

      - name: Compute breadth
        env:
          PRICE_STORE: .price-store
        run: python scripts/breadth.py

      - name: Save stored prices
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view price-data >/dev/null 2>&1 || gh release create price-data --latest=false \
            --title "Breadth price data" \
            --notes "Daily closing prices used by scripts/breadth.py. Replaced automatically by the Index breadth Action on every run; not a software release."
          gh release upload price-data .price-store/* --clobber

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/breadth
          git diff --staged --quiet && exit 0
          git commit -m "Index breadth $(date -u +%F)"
          git pull --rebase -X theirs
          git push
