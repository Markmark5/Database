name: Index breadth daily

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - data/breadth/*_members.csv   # re-run as soon as a new member list is uploaded
  schedule:
    - cron: "40 21 * * 1-5"   # 21:40 UTC weekdays, after both the LSE and US closes
    - cron: "10 6 * * 2-6"    # 06:10 UTC Tue-Sat, before the LSE open: picks up any late Yahoo data

permissions:
  contents: write

concurrency:
  group: breadth-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet yfinance pandas numpy

      - name: Compute breadth
        run: python scripts/breadth.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/breadth
          git diff --staged --quiet && exit 0
          git commit -m "Index breadth $(date -u +%F)"
          git pull --rebase -X theirs
          git push
