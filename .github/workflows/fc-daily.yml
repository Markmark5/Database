name: Broker forecasts daily save

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "50 16 * * 1-5"   # 16:50 UTC weekdays, after the close (GitHub may start it hours late; the script dates a pre-9am run to the previous trading day)

permissions:
  contents: write

concurrency:
  group: fc-daily
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save today's forecast figures
        run: python scripts/fc_daily.py

      - name: Commit results
        run: |
          git config user.name  "fc-bot"
          git config user.email "fc-bot@users.noreply.github.com"
          git add -A data/fc_daily
          git diff --staged --quiet && exit 0
          git commit -m "Broker forecasts $(date -u +%F)"
          git pull --rebase -X theirs
          git push
