name: US earnings revisions

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/earnings_us.py
  schedule:
    - cron: "37 8 * * 6"      # Saturday 08:37 UTC, after Friday's US close

permissions:
  contents: write

concurrency:
  group: earnings-us-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet yfinance pandas lxml

      - name: Build US earnings summary (S&P 500, Nasdaq 100) from Yahoo consensus
        run: python scripts/earnings_us.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings/summary_us.json data/earnings/us_weekly.json data/earnings/ndx_members.csv
          git diff --staged --quiet && exit 0
          git commit -m "US earnings revisions $(date -u +%F)"
          git pull --rebase -X theirs
          git push
